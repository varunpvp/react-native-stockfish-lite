name: Build library
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --workspaces=false --package-lock=false
      - run: npm run build
      - run: git diff --exit-code -- lib/
      - run: npm pack --dry-run
